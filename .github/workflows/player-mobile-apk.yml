name: Player standalone APK

# Build an installable, self-contained Android APK after Player changes land
# on master. Pull requests deliberately do not produce APK artifacts.
on:
  push:
    branches:
      - master
    paths:
      - "Player/**"
      - ".github/workflows/player-mobile-apk.yml"

concurrency:
  group: player-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-build:
    name: Android standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: Player/mobile/.nvmrc
          cache: npm
          cache-dependency-path: Player/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: Player/mobile
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Player/mobile/android/**/*.gradle*', 'Player/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: chmod gradlew
        run: chmod +x Player/mobile/android/gradlew

      # Release builds bundle the React Native JavaScript into the APK, so the
      # installed app does not require Metro or Expo. build.gradle currently
      # signs this variant with the repository's debug keystore.
      - name: Assemble standalone APK
        working-directory: Player/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: player-mobile-standalone-apk
          path: Player/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
