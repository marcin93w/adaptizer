name: InstrumentUI

# Quality gates for InstrumentUI (Electron + React + Vitest).
#
# This is a monorepo (the git root is above InstrumentUI/). Sibling projects
# (API/, Player/) are untouched by this workflow. The path filters
# below are the ONLY thing that keeps this workflow from running on unrelated
# changes - keep them in sync with any future restructuring of InstrumentUI.

on:
  pull_request:
    paths:
      - 'InstrumentUI/**'
      - '.github/workflows/instrument-ui.yml'
  push:
    paths:
      - 'InstrumentUI/**'
      - '.github/workflows/instrument-ui.yml'

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: instrument-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type checking, unit tests and the production build.
  #
  # Runs on windows-latest even though the Vitest suite is OS-independent by
  # design (see InstrumentUI/docs/testing-strategy.md): the *product* is
  # Windows-only - PowerShell export scripts, Ableton, `taskkill`, backslash
  # paths - and this job also runs `npm run build`, which is where `tsc` and
  # Parcel path/casing problems actually surface.
  checks:
    name: Typecheck, test, build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: InstrumentUI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: InstrumentUI/.nvmrc
          cache: npm
          cache-dependency-path: InstrumentUI/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      # `tsc -p tsconfig.test.json --noEmit` - the test tsconfig, so src/testing
      # and the specs are type checked too. The build below uses tsconfig.json.
      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest, coverage)
        run: npm run test:ci

      # tsc (main process) + copy-scripts + parcel build (renderer).
      - name: Build
        run: npm run build

      # Coverage is evidence, not a gate - no thresholds are configured in
      # vitest.config.ts and none should be added globally.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-ui-coverage
          path: InstrumentUI/coverage
          if-no-files-found: ignore
          retention-days: 14
