name: Player mobile PR checks

# React Native pull-request quality gates for Player/mobile.
#
# This is a monorepo (the git root is above Player/). Sibling projects
# (Instrument/) is untouched by this workflow. The path
# filters below are the ONLY thing that keeps this workflow from running on
# unrelated changes - keep them in sync
# with any future restructuring of Player/mobile, Player/adaptive-audio or
# Player/test-media.

on:
  pull_request:
    paths:
      - "Player/mobile/**"
      - "Player/adaptive-audio/**"
      - "Player/test-media/**"
      - ".github/workflows/player-mobile.yml"

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: player-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: formatting, linting, type checking and unit tests. Mirrors
  # `npm run verify` in Player/mobile (see Player/docs/quality-gates.md).
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Player/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: Player/mobile/.nvmrc
          cache: npm
          cache-dependency-path: Player/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (Jest, CI mode + coverage)
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: Player/mobile/coverage
          if-no-files-found: ignore
          retention-days: 14

  # Job 2: dependency audit and license evidence. Deliberately non-blocking -
  # failures here are uploaded as artifacts but do not fail the run.
  audit:
    name: Dependency audit and license report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Player/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: Player/mobile/.nvmrc
          cache: npm
          cache-dependency-path: Player/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: npm audit (informational only)
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Save npm audit JSON
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high --json > npm-audit-report.json

      - name: License report (informational only)
        id: license
        continue-on-error: true
        run: npm run license-report

      - name: Upload audit and license evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dependency-evidence
          path: |
            Player/mobile/npm-audit-report.json
            Player/mobile/license-report.json
          if-no-files-found: warn
          retention-days: 30
