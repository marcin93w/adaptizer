name = "adaptizer"
main = "worker.js"
compatibility_date = "2025-02-14"

# The catalog database. This binding was originally added through the
# Cloudflare dashboard and was therefore absent from the deployed
# wrangler.toml - it MUST stay declared here, because a `wrangler deploy`
# replaces the Worker's bindings with exactly what this file lists. Without
# it, `env.db` becomes undefined and every request fails.
[[d1_databases]]
binding = "db"
database_name = "adaptizer"
database_id = "833c14d9-eefb-4e9f-b005-b037f601bc32"

# The audio bucket. The read path needs no R2 binding - the Player streams
# straight off the public bucket - so this exists solely for the publish write
# path, which proxies audio through the Worker into R2 (see ADR-0002). Like the
# D1 binding above, it MUST stay declared here or `env.bucket` is undefined and
# `POST /` fails.
[[r2_buckets]]
binding = "bucket"
bucket_name = "adaptizer"

[observability]
enabled = true
